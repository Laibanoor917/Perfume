<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        font-family: 'Georgia', serif;
    }
    body{
       background: #f4eeea;
    }
    .title{
        font-family: 'Georgia', serif;
        font-size: 25px;
        margin-top: 10px;
        
    }
    .products{
         display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 25px;
    margin-left: 40px;
    }
.products {
    display: grid;
   margin-top: 30px;
    gap: 25px;
    padding: 20px 8%;
    transition: all 0.3s ease;
}
.product:hover {
    transform: translateY(-7px);
    box-shadow: 0 12px 25px #00000018;
}
.product {
    background: white;
    padding-bottom: 25px;
    box-shadow: 0 4px 15px #0000000c;
    transition: 0.3s;
}
   .product img {
    width: 100%;
    height: 250px;
    object-fit: cover;
   }
        .product h3 {
    text-align: center;
    margin: 15px 0 5px;
    font-family: arial, sans-serif;
}
   .product h5 {
     font-family: arial, sans-serif;
    text-align: center;
    color: #4a4442;
    margin-bottom: 10px;
    margin-top: 20px;
    margin-right: 20px;
}
footer {
    background-color: #000;
    color: #d99b91;
    text-align: center;
    padding: 35px 20px;
    font-family: "Times New Roman", serif;
    margin-top: 40px;
}

footer h3 {
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 12px;
}

footer p {
    font-size: 14px;
    letter-spacing: 1px;
    margin: 10px 0;
}
    </style>
</head>
<body>
    <div class="title">
    <h1 style="text-align: center;">PRODUCTS</h1>
    </div>
 <div class="products">
<div class="product">

</div>
<div class="product">

</div>
<div class="product">
    <img src="1png.png" alt="">

<div class="product">
    <img src="CRISTALLE.jpg" alt="">
    <h3>CRISTALLE</h3>

</div>
<div class="product">
    <img src="ALLURE.jpg" alt="">
    <h3>ALLURE SENSUELLE</h3>

</div>
<div class="product">

    <h3>GABRIELLE CHANEL</h3>

<div class="product">

     <h3>PLATINUM ÉGOÏSTE</h3>

<h3>CHANEL</h3>

</html>
